# ADR-0009 §1: publish the API and web images to GHCR for every `main` commit that passed `ci`.
# Runs when the `ci` workflow (.github/workflows/ci.yml, name: ci) completes successfully on main (workflow_run), or by
# hand (workflow_dispatch, re-publish). On workflow_run, github.sha is the latest commit of the default branch, which may
# already be newer than the commit ci tested, so the checkout and the sha tag use workflow_run.head_sha instead.
# Tags: sha-<7 chars> and latest. linux/amd64 only (no QEMU cross-build). Auth: GITHUB_TOKEN only (CLAUDE.md rule 7).
name: publish-images

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two main pushes close together publish `latest` in commit order instead of racing.
concurrency:
  group: publish-images
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            image: ghcr.io/lim950808/openrun-api
            context: .
            dockerfile: apps/api/Dockerfile
            build-args: ""
          - name: web
            image: ghcr.io/lim950808/openrun-web
            context: apps/web
            dockerfile: apps/web/Dockerfile
            # Same-origin rewrite target inside compose, resolved at build time (ADR-0008 §1, ADR-0009 §1).
            build-args: API_BASE_URL=http://api:8080
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          # `context: git` takes sha/ref from the checkout above, so type=sha is the tested commit, not github.sha.
          context: git
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          build-args: ${{ matrix.build-args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

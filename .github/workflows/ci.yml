name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Unit tests + Testcontainers Boot 4 gate smoke + ArchUnit boundary rules.
      - run: ./gradlew build --no-daemon

  k6-smoke:
    needs: build
    runs-on: ubuntu-latest
    env:
      OPENRUN_DB_URL: jdbc:postgresql://localhost:5432/openrun
      OPENRUN_DB_USER: openrun
      OPENRUN_DB_PASSWORD: openrun
      OPENRUN_REDIS_HOST: localhost
      OPENRUN_REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Start compose core
        run: docker compose -f infra/compose/compose.yaml --profile core up -d --wait
      - name: Start API
        run: |
          ./gradlew :apps:api:bootRun --no-daemon > bootRun.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          cat bootRun.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: k6 smoke
        run: k6 run load/k6/smoke.js
      - name: Show API log
        if: failure()
        run: cat bootRun.log || true
      - name: Stop compose core
        if: always()
        run: docker compose -f infra/compose/compose.yaml --profile core down -v

  # ADR-0008 §1: the web app is not part of the Gradle build.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # M4-1 ~ M4-3 journey: compose core + API (Fake PG) + Next server + Playwright (Chromium).
  web-e2e:
    needs: build
    runs-on: ubuntu-latest
    env:
      OPENRUN_DB_URL: jdbc:postgresql://localhost:5432/openrun
      OPENRUN_DB_USER: openrun
      OPENRUN_DB_PASSWORD: openrun
      OPENRUN_REDIS_HOST: localhost
      OPENRUN_REDIS_PORT: "6379"
      OPENRUN_PAYMENT_PG: fake
      OPENRUN_QUEUE_ADMISSIONS_PER_SECOND: "100"
      API_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start compose core
        run: docker compose -f infra/compose/compose.yaml --profile core up -d --wait
      - name: Start API
        run: |
          ./gradlew :apps:api:bootRun --no-daemon > bootRun.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          cat bootRun.log
          exit 1
      - name: Install web dependencies and Chromium
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start web
        working-directory: apps/web
        run: |
          npm run build
          npm run start > ../../web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000 > /dev/null; then
              echo "web is up"
              exit 0
            fi
            sleep 1
          done
          echo "web did not start"
          cat ../../web.log
          exit 1
      - name: Playwright
        working-directory: apps/web
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 14
      - name: Show logs
        if: failure()
        run: |
          cat bootRun.log || true
          cat web.log || true
      - name: Stop compose core
        if: always()
        run: docker compose -f infra/compose/compose.yaml --profile core down -v

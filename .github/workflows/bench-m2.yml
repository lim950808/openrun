name: bench-m2

# M2 waiting-queue benchmark (refresh storm + weekly open run bot), Saturday 01:30 UTC after bench-m1.
on:
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:
    inputs:
      vus:
        description: refresh-storm VUs (members polling every 0.2 s)
        default: "1000"
      storm_duration_s:
        description: refresh-storm duration in seconds
        default: "30"
      members:
        description: weekly bot members arriving over the window
        default: "2000"
      duration_s:
        description: weekly bot arrival window in seconds (scenario stages are scaled to fit)
        default: "120"

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENRUN_DB_URL: jdbc:postgresql://localhost:5432/openrun
      OPENRUN_DB_USER: openrun
      OPENRUN_DB_PASSWORD: openrun
      OPENRUN_REDIS_HOST: localhost
      OPENRUN_REDIS_PORT: "6379"
      # Queue settings (ADR-0006 §6). Must match ADMISSIONS_PER_SECOND below and the scenario yaml.
      OPENRUN_QUEUE_ADMISSIONS_PER_SECOND: "100"
      OPENRUN_QUEUE_ABANDON_AFTER: PT30S
      OPENRUN_QUEUE_REQUIRE_ACCESS_TOKEN: "true"
      ADMISSIONS_PER_SECOND: "100"
      BASE_URL: http://localhost:8080
      # schedule runs carry no inputs; fall back to the documented defaults.
      VUS: ${{ inputs.vus || '1000' }}
      STORM_DURATION_S: ${{ inputs.storm_duration_s || '30' }}
      MEMBERS: ${{ inputs.members || '2000' }}
      DURATION_S: ${{ inputs.duration_s || '120' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate token secret
        # A fresh signing key per run (ADR-0006 §3); never stored.
        run: |
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"
          echo "OPENRUN_TOKEN_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Start compose core
        run: docker compose -f infra/compose/compose.yaml --profile core up -d --wait
      - name: Start API
        run: |
          ./gradlew :apps:api:bootRun --no-daemon > bootRun.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health > /dev/null; then
              echo "API is up"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          cat bootRun.log
          exit 1
      - uses: grafana/setup-k6-action@v1
      - name: Capture runner spec
        run: |
          mkdir -p load/results
          {
            echo "nproc=$(nproc)"
            free -g | head -2
            echo "kernel=$(uname -r)"
          } > load/results/runner-spec.txt
          cat load/results/runner-spec.txt
      - name: Benchmark
        run: load/bench-m2.sh
      - name: Report
        run: |
          python3 load/report/m2_report.py \
            --label "GitHub Actions ubuntu-latest, $(tr '\n' ' ' < load/results/runner-spec.txt)" \
            --out load/results/m2-report.md
          cat load/results/m2-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Copy API log
        if: always()
        run: cp bootRun.log load/results/ || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-m2-results
          path: load/results/
      - name: Stop compose core
        if: always()
        run: docker compose -f infra/compose/compose.yaml --profile core down -v

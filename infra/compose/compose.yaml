name: openrun

services:
  postgres:
    image: postgres:17-alpine
    profiles: ["core"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openrun}
      POSTGRES_USER: ${POSTGRES_USER:-openrun}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openrun}
    # Logical decoding is enabled up front so Debezium (2차) can attach without a restart.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["core"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:

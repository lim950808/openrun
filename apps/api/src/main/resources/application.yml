spring:
  application:
    name: openrun-api
  config:
    # Local secrets (gitignored). bootRun runs in apps/api, so the repo-root file is two levels up.
    import: optional:file:.env[.properties],optional:file:../../.env[.properties]
  datasource:
    url: ${OPENRUN_DB_URL:jdbc:postgresql://localhost:5432/openrun}
    username: ${OPENRUN_DB_USER:openrun}
    password: ${OPENRUN_DB_PASSWORD:openrun}
    hikari:
      maximum-pool-size: ${OPENRUN_DB_POOL:32}
  data:
    redis:
      host: ${OPENRUN_REDIS_HOST:localhost}
      port: ${OPENRUN_REDIS_PORT:6379}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.batch_size: 100
  flyway:
    enabled: true

server:
  port: 8080

openrun:
  hold:
    strategy: ${OPENRUN_HOLD_STRATEGY:CONDITIONAL_UPDATE}
    allow-strategy-override: ${OPENRUN_HOLD_ALLOW_OVERRIDE:false}
    ttl: ${OPENRUN_HOLD_TTL:PT12M}
    naive-delay-ms: ${OPENRUN_HOLD_NAIVE_DELAY_MS:0}
    janitor-delay-ms: ${OPENRUN_HOLD_JANITOR_DELAY_MS:5000}
  queue:
    admissions-per-second: ${OPENRUN_QUEUE_ADMISSIONS_PER_SECOND:100}
    entry-lead: ${OPENRUN_QUEUE_ENTRY_LEAD:PT10M}
    abandon-after: ${OPENRUN_QUEUE_ABANDON_AFTER:PT30S}
    access-token-ttl: ${OPENRUN_QUEUE_ACCESS_TOKEN_TTL:PT10M}
    visitor-token-ttl: PT3H
    tick-ms: ${OPENRUN_QUEUE_TICK_MS:1000}
    require-access-token: ${OPENRUN_QUEUE_REQUIRE_ACCESS_TOKEN:true}
    token-secret: ${OPENRUN_TOKEN_SECRET:dev-only-not-a-secret-openrun-local-token-key}
  # ADR-0007 §6. Keys come from the environment or the gitignored .env (see .env.example), never from the repo.
  payment:
    pg: ${OPENRUN_PAYMENT_PG:fake}
    confirming-timeout: ${OPENRUN_PAYMENT_CONFIRMING_TIMEOUT:PT30S}
    unknown-release-after: ${OPENRUN_PAYMENT_UNKNOWN_RELEASE_AFTER:PT5M}
    janitor-delay-ms: ${OPENRUN_PAYMENT_JANITOR_DELAY_MS:5000}
    toss:
      secret-key: ${OPENRUN_TOSS_SECRET_KEY:}
      client-key: ${OPENRUN_TOSS_CLIENT_KEY:}
      webhook-secret: ${OPENRUN_TOSS_WEBHOOK_SECRET:dev-only-not-a-secret-openrun-webhook-key}
    fake-pg:
      webhooks: ${OPENRUN_FAKE_PG_WEBHOOKS:true}
      webhook-url: ${OPENRUN_FAKE_PG_WEBHOOK_URL:http://localhost:${server.port}/api/webhooks/toss}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  metrics:
    distribution:
      # Hikari's acquire timer is process-wide (no strategy tag); a 2~3 min window covers one 120 s arrival run.
      percentiles:
        "[hikaricp.connections.acquire]": 0.5,0.99
      expiry:
        "[hikaricp.connections.acquire]": PT3M
      buffer-length:
        "[hikaricp.connections.acquire]": 3

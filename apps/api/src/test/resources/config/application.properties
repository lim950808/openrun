# Shared by every @SpringBootTest so they reuse one cached context (and one pair of containers).
openrun.hold.allow-strategy-override=true
openrun.hold.naive-delay-ms=30
# Tests call HoldExpiryJanitor.sweep() themselves; keep the scheduled run out of the way.
openrun.hold.janitor-delay-ms=3600000
spring.datasource.hikari.maximum-pool-size=48
# Queue (ADR-0006): tests call AdmissionScheduler.tick() themselves. Seat APIs require the access token, as in prod.
openrun.queue.tick-ms=3600000
openrun.queue.abandon-after=PT2S
openrun.queue.admissions-per-second=5
openrun.queue.require-access-token=true
# Payment (ADR-0007): Fake PG, janitor driven by tests via PaymentJanitor.tick(now).
openrun.payment.pg=fake
openrun.payment.janitor-delay-ms=3600000
openrun.payment.confirming-timeout=PT2S
openrun.payment.unknown-release-after=PT5S
openrun.payment.toss.webhook-secret=test-webhook-secret
openrun.payment.fake-pg.webhooks=false

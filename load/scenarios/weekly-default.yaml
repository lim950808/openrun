# schema (docs/requirements.md §5, behaviour distributions in ADR-0002)
#   scenario                         : scenario id, used in report headers
#   description                      : one-line purpose
#   virtual_users                    : number of distinct synthetic members (pre-created ids)
#   arrival.executor                 : k6 executor; always ramping-arrival-rate (open model)
#   arrival.unit                     : rate unit; requests per second, polling included
#   arrival.stages[]                 : ordered ramp stages; at = KST wall clock (HH:MM), target_rps = rate reached at that time
#   queue.enabled                    : whether requests go through the waiting queue
#   queue.entry_opens_at             : earliest queue entry (KST, HH:MM)
#   queue.admissions_per_second      : admission rate control (Bucket4j)
#   abandon_probability              : per-member probability of leaving the queue; decided at entry,
#                                      leave time uniform within the member's own wait time
#   seat_select_seconds              : distribution of seat selection time
#   seat_choice.hot_ratio            : share of holds aimed at the hot pool
#   seat_choice.hot_pool             : number of best seats (lowest VIP seat ids) in the hot pool
#   payment_abandon_probability      : per-member probability of leaving after entering the payment widget
#   payment_seconds                  : distribution of payment duration
#   polling_interval_seconds         : bot queue polling interval
#   macro_ratio                      : share of members that are macros
#   macro.seat_select_seconds        : macro seat selection time (fixed)
#   macro.polling_interval_seconds   : macro polling interval (fixed)
#   refresh_storm_interval_seconds   : polling interval in the refresh-storm variant
#   fake_pg.fault_mix                : share of payments per Fake PG fault (ADR-0007 §2); each payment carries one
#                                      value (NONE · DECLINE · TIMEOUT · TIMEOUT_THEN_INQUIRY_DOWN · DELAY), so the
#                                      report compares unknown_count etc. with the injected counts
#   fake_pg.delay_seconds            : confirm response delay for DELAY
#   fake_pg.webhooks                 : Fake PG posts a signed DONE webhook after each approval (API setting
#                                      OPENRUN_FAKE_PG_WEBHOOKS; recorded here for the report)
# Distributions: {type: uniform, min, max} | {type: normal, mean, sd} | {type: fixed, value}
# Only per-member probabilities (abandon_probability, payment_abandon_probability, macro_ratio) are
# ground truth for the 2차 reconstruction check; process parameters are not.

scenario: weekly-default
description: Saturday 20:00 KST weekly open run through the waiting queue

virtual_users: 10000

arrival:
  executor: ramping-arrival-rate
  unit: rps
  stages:
    - at: "19:50"
      target_rps: 0
    - at: "20:00"
      target_rps: 3000
    - at: "20:05"
      target_rps: 3000
    - at: "20:10"
      target_rps: 0

queue:
  enabled: true
  entry_opens_at: "19:50"
  admissions_per_second: 100

abandon_probability: 0.15

seat_select_seconds:
  type: uniform
  min: 10
  max: 90

# 80% of holds target the 50 'best' seats (first VIP rows, lowest seat ids within VIP); the rest pick uniformly
# from all seats. Models front-row competition.
seat_choice: { hot_ratio: 0.8, hot_pool: 50 }

payment_abandon_probability: 0.12

payment_seconds:
  type: normal
  mean: 60
  sd: 20

polling_interval_seconds: 2

macro_ratio: 0.05
macro:
  seat_select_seconds:
    type: fixed
    value: 1
  polling_interval_seconds: 0.2

refresh_storm_interval_seconds: 0.2

fake_pg:
  fault_mix: { NONE: 0.95, TIMEOUT: 0.03, DELAY: 0.01, DECLINE: 0.01 }
  delay_seconds: 2
  webhooks: true
